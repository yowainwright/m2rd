name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false
  queue: max

jobs:
  revision:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.revision.outputs.sha }}
      bump: ${{ steps.revision.outputs.bump }}
    steps:
      - name: Checkout release history
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve release revision
        id: revision
        env:
          SOURCE_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            printf 'sha=%s\nbump=false\n' "$SOURCE_SHA" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          released_sha=$(git log --first-parent --format=%H -1 --grep="^Release-Source: $SOURCE_SHA$" origin/main)
          if [ -n "$released_sha" ]; then
            if [ "$released_sha" != "$(git rev-parse HEAD)" ]; then
              echo '::error::This release was superseded. Redeploy current main with manual dispatch.'
              exit 1
            fi
            printf 'sha=%s\nbump=false\n' "$released_sha" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf 'sha=%s\nbump=true\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  checks:
    needs: revision
    uses: ./.github/workflows/test.yml
    with:
      ref: ${{ needs.revision.outputs.sha }}

  release:
    needs: [revision, checks]
    if: needs.revision.outputs.bump == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - name: Checkout main
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: main
          fetch-depth: 0

      - name: Verify checked revision
        env:
          CHECKED_SHA: ${{ needs.revision.outputs.sha }}
        run: test "$(git rev-parse HEAD)" = "$CHECKED_SHA"

      - name: Setup pnpm
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2
        with:
          version: 12.2.1
          cache: true
          install: false
          runtime: node@26

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create patch release
        id: release
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          release_message=$(printf "chore(release): \${version}\n\nRelease-Source: %s" "$SOURCE_SHA")
          pnpm exec release-it patch --ci --no-hooks --git.push \
            --git.commitMessage="$release_message" \
            --git.pushArgs=--follow-tags --git.pushArgs=--atomic
          printf 'sha=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    needs: [revision, checks, release]
    if: >-
      ${{ !cancelled() && needs.checks.result == 'success' &&
          (needs.release.result == 'success' || needs.release.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ needs.release.outputs.sha || needs.revision.outputs.sha }}
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2
        with:
          version: 12.2.1
          cache: true
          install: false
          runtime: node@26

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build static site
        run: pnpm run build

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Test exported site
        run: pnpm run test:e2e

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128
