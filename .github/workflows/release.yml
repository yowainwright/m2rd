name: Release

on:
  workflow_call:
    inputs:
      tag:
        description: Exact tag to publish after validation
        type: string
        required: true
      checks-passed:
        description: Caller has already completed the reusable test workflow
        type: boolean
        default: false
    secrets:
      HOMEBREW_TAP_TOKEN:
        required: false
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  test:
    if: ${{ !inputs.checks-passed }}
    uses: ./.github/workflows/test.yml
    with:
      ref: refs/tags/${{ inputs.tag || github.ref_name }}

  release:
    needs: test
    if: >-
      ${{ !cancelled() && (needs.test.result == 'success' ||
          (inputs.checks-passed && needs.test.result == 'skipped')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2
        with:
          version: 12.2.1
          cache: true
          install: false
          runtime: node@26

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify tag matches package version
        run: test "${TAG#v}" = "$(node -p 'require("./package.json").version')"

      - name: Pack CLI tarball
        run: pnpm run cli:pack

      - name: Create GitHub release
        run: |
          set -euo pipefail
          ASSET="m2rd-${TAG#v}.tgz"
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release view "$TAG" --json assets |
              jq -e --arg name "$ASSET" '.assets | any(.name == $name)'
            exit 0
          fi
          gh release create "$TAG" "tmp/$ASSET" --title "$TAG" --generate-notes --verify-tag

  tap:
    needs: release
    if: ${{ !cancelled() && needs.release.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout Homebrew tap
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          repository: yowainwright/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          ref: main
          persist-credentials: false

      - name: Update formula
        run: |
          VERSION="${TAG#v}"
          ASSET="m2rd-${VERSION}.tgz"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$ASSET"
          SHA="$(sha256sum "$ASSET" | cut -d' ' -f1)"
          rm "$ASSET"
          sed -i -E \
            -e "s#^  url \".*\"#  url \"https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${ASSET}\"#" \
            -e "s#^  sha256 \".*\"#  sha256 \"${SHA}\"#" \
            Formula/m2rd.rb
          jq --arg v "$VERSION" '.version = $v' brews/m2rd.json > brews/m2rd.json.tmp
          mv brews/m2rd.json.tmp brews/m2rd.json

      - name: Open formula pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1
        with:
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          add-paths: |
            Formula/m2rd.rb
            brews/m2rd.json
          base: main
          branch: m2rd
          commit-message: 'm2rd ${{ inputs.tag || github.ref_name }}'
          title: 'm2rd ${{ inputs.tag || github.ref_name }}'
          body: |
            Update m2rd.

            Release: https://github.com/${{ github.repository }}/releases/tag/${{ inputs.tag || github.ref_name }}
