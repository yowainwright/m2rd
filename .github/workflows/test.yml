name: Test

on:
  workflow_call:
    inputs:
      ref:
        description: Exact revision to validate for release
        type: string
        required: false
      pages-artifact:
        description: Upload the tested static site for deployment
        type: boolean
        default: false
      patch-version:
        description: Build the site with the upcoming patch release version
        type: boolean
        default: false
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dependency-security:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}

      - name: Setup pnpm
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2
        with:
          version: 12.2.1
          cache: true
          install: false
          runtime: node@26

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Pastoralist security check
        run: pnpm run deps:security

      - name: Audit resolved dependencies
        run: pnpm run deps:audit

  lint-and-typecheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      FS_LINT_BASE: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2
        with:
          version: 12.2.1
          cache: true
          install: false
          runtime: node@26

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install shell lint tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Install structure linters
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ github.token }}
        run: |
          /home/linuxbrew/.linuxbrew/bin/brew install yowainwright/tap/fs-lint yowainwright/tap/src-lint yowainwright/tap/struct-lint
          echo /home/linuxbrew/.linuxbrew/bin >> "$GITHUB_PATH"

      - name: Type check
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint:ci

      - name: Prepare site release version
        if: inputs.patch-version
        run: npm version patch --no-git-tag-version --ignore-scripts

      - name: Check build
        env:
          NEXT_PUBLIC_M2RD_API_ORIGIN: http://127.0.0.1:54785
        run: pnpm run build

      - name: Check CLI build
        run: pnpm run cli:build

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps --only-shell chromium

      - name: Test exported site
        run: pnpm run test:e2e

      - name: Build Pages artifact with production API origin
        if: inputs.pages-artifact
        run: pnpm run build

      - name: Upload tested Pages artifact
        if: inputs.pages-artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: out
          retention-days: 1

  unit-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}

      - name: Setup pnpm
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2
        with:
          version: 12.2.1
          cache: true
          install: false
          runtime: node@26

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests
        run: pnpm run test:unit

      - name: Run integration tests
        run: pnpm run test:integration
